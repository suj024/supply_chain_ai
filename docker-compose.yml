version: '3.8'

services:

  backend:
    build: .
    container_name: supply_chain_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: always

  frontend:
    build: ./frontend
    container_name: supply_chain_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always